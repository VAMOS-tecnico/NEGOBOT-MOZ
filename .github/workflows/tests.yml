name: NEGOBOT automated tests

on:
  push:
    branches:
      - main
      - react-platform-preview
  pull_request:
    branches:
      - main
      - react-platform-preview

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m py_compile $(find . -name '*.py' -not -path './.git/*')

      - name: Check whitespace
        run: git diff --check

      - name: Run unit and integration tests
        env:
          PLATFORM_SECRET_KEY: ci-test-secret
          EVOLUTION_INSTANCE_NAME: assistente_negobot
          EVOLUTION_API_URL: https://evolution.test
          EVOLUTION_API_KEY: ci-evolution-key
        run: python -m unittest discover -s tests -p 'test_*.py' -v
