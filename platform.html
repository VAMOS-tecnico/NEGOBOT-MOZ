<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plataforma | NEGOBOT-MOZ</title>
  <style>
    :root{--ink:#07111f;--panel:#10243b;--panel2:#142d48;--line:rgba(255,255,255,.12);--text:#edf7f5;--muted:#91a9ba;--cyan:#57e7d4;--lime:#c8f26b;--coral:#ff9d84}*{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--ink);font:15px Inter,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:flex}.side{width:255px;padding:28px 18px;border-right:1px solid var(--line);background:#091a2c}.brand{display:flex;align-items:center;gap:10px;margin:0 10px 44px;font-weight:800;letter-spacing:-.04em}.mark{width:31px;height:31px;display:grid;place-items:center;border-radius:10px;color:var(--ink);background:var(--cyan)}.mark:after{content:"";width:11px;height:11px;border:3px solid var(--ink);border-top-color:transparent;border-radius:50%;transform:rotate(-35deg)}.nav{display:grid;gap:7px}.nav button{width:100%;padding:12px 13px;text-align:left;border:0;border-radius:9px;color:var(--muted);background:transparent}.nav button.active,.nav button:hover{color:var(--text);background:rgba(87,231,212,.1)}.side-foot{position:fixed;bottom:20px;width:215px;color:#638096;font-size:12px;line-height:1.5}.main{width:min(1180px,calc(100% - 255px));padding:32px 40px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:25px;margin-bottom:34px}.kicker{margin:0 0 8px;color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.top h1{margin:0;font-size:clamp(30px,4vw,48px);letter-spacing:-.06em}.top p{color:var(--muted)}.user-area{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:var(--ink);background:var(--lime);font-weight:800}.logout{padding:8px 12px;border:1px solid var(--line);border-radius:8px;color:var(--muted);background:transparent}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:26px}.metric,.card{padding:21px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,var(--panel),rgba(16,36,59,.65))}.metric-label{color:var(--muted);font-size:12px}.metric-value{margin-top:10px;font-size:29px;font-weight:800;letter-spacing:-.06em}.metric-accent{color:var(--cyan)}.content-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.card h2{margin:0 0 7px;font-size:19px;letter-spacing:-.04em}.card p{margin:0;color:var(--muted);line-height:1.55}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.chip{padding:9px 11px;border-radius:8px;color:#b8d1dc;background:rgba(255,255,255,.06);font-size:12px}.list{display:grid;gap:10px;margin-top:18px}.list-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px;border:1px solid var(--line);border-radius:10px;color:#bed0da}.status{display:inline-flex;align-items:center;gap:5px;color:var(--lime);font-size:12px}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 70% 15%,#163a50 0,transparent 32%),var(--ink)}.login{width:min(430px,100%);padding:34px;border:1px solid var(--line);border-radius:18px;background:rgba(16,36,59,.9);box-shadow:0 30px 100px rgba(0,0,0,.3)}.login h1{margin:16px 0 8px;font-size:34px;letter-spacing:-.06em}.login p{color:var(--muted);line-height:1.55}.field{display:grid;gap:7px;margin:16px 0}.field label{color:#b7ccda;font-size:12px;font-weight:700}.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:9px;outline:none;color:var(--text);background:rgba(0,0,0,.16)}.field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(87,231,212,.1)}.primary{width:100%;margin-top:8px;padding:13px;border:0;border-radius:9px;color:var(--ink);background:var(--cyan);font-weight:800}.notice{min-height:20px;margin-top:15px;color:var(--coral);font-size:13px}.hidden{display:none!important}.section{display:none}.section.active{display:block}.form-row{display:flex;gap:10px;margin-top:18px}.form-row input{min-width:0;flex:1;padding:11px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:rgba(0,0,0,.15)}.plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.plan-card{position:relative;display:flex;flex-direction:column;gap:12px}.plan-card.featured{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(87,231,212,.18),0 20px 60px rgba(0,0,0,.18)}.plan-price{font-size:32px;font-weight:800;color:var(--cyan)}.plan-card ul{margin:0;padding-left:18px;color:var(--muted);line-height:1.7;font-size:13px}.plan-card button{margin-top:auto}.payment-box{margin-top:18px;padding:18px;border-radius:12px;background:rgba(87,231,212,.07);border:1px solid rgba(87,231,212,.2)}@media(max-width:900px){.plans-grid{grid-template-columns:1fr}}.secondary{padding:11px 14px;border:1px solid rgba(87,231,212,.4);border-radius:8px;color:var(--cyan);background:transparent;font-weight:700}@media(max-width:900px){.side{width:205px}.main{width:calc(100% - 205px);padding:27px}.side-foot{width:165px}.content-grid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.shell{display:block}.side{width:auto;padding:16px;border-right:0;border-bottom:1px solid var(--line)}.brand{margin:0 0 15px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-foot{display:none}.main{width:100%;padding:22px 16px}.top{display:block}.user-area{margin-top:20px}.grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const app = document.getElementById('app');
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function loginView(message='') { app.innerHTML = `<main class="login-wrap"><form class="login" id="login-form"><div class="brand"><span class="mark"></span>NEGOBOT-MOZ</div><p class="kicker">Plataforma de atendimento</p><h1>Entra no teu espaço.</h1><p>O administrador vê a plataforma inteira. Cada cliente vê apenas os seus contactos, campanhas, conversas e integrações.</p><div class="field"><label for="identifier">Email ou administrador</label><input id="identifier" autocomplete="username" placeholder="nome@empresa.co.mz" required></div><div class="field"><label for="password">Palavra-passe</label><input id="password" type="password" autocomplete="current-password" placeholder="Mínimo de 8 caracteres" required></div><button class="primary">Entrar na plataforma</button><div class="notice">${escapeHtml(message)}</div></form></main>`; document.getElementById('login-form').addEventListener('submit', async e => { e.preventDefault(); const btn=e.submitter; btn.disabled=true; const res=await fetch('/api/platform/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:document.getElementById('identifier').value,password:document.getElementById('password').value})}); const data=await res.json().catch(()=>({})); if(!res.ok){btn.disabled=false; loginView(data.error||'Não foi possível iniciar sessão.');return} renderShell(data.user); }); }
    async function api(path, options={}) { const res=await fetch(path,{credentials:'same-origin',...options}); const data=await res.json().catch(()=>({})); if(res.status===401){loginView('A sessão terminou.');throw new Error('auth')} if(!res.ok) throw new Error(data.error||'Erro na plataforma'); return data; }
    function navSection(title, copy, body){ document.querySelectorAll('.section').forEach(x=>x.classList.remove('active')); const section=document.querySelector(`[data-section="${title}"]`); if(section){section.classList.add('active');section.querySelector('[data-section-title]').textContent=copy;section.querySelector('[data-section-body]').innerHTML=body;} }
    async function renderShell(user){ const isAdmin=['owner','admin'].includes(user.role); window.platformIsAdmin=isAdmin; app.innerHTML=`<div class="shell"><aside class="side"><div class="brand"><span class="mark"></span>NEGOBOT-MOZ</div><nav class="nav"><button class="active" data-nav="overview">Visão geral</button>${isAdmin?'<button data-nav="tenants">Clientes e planos</button><button data-nav="integrations">Integrações globais</button><button data-nav="audit">Auditoria e saúde</button>':'<button data-nav="contacts">Contactos</button><button data-nav="campaigns">Campanhas e disparos</button><button data-nav="plans">Planos e pagamento</button><button data-nav="inbox">Conversas</button><button data-nav="assistant">Assistente IA</button>'}</nav><div class="side-foot">Ambiente protegido<br>Os dados são isolados por conta.</div></aside><main class="main"><header class="top"><div><p class="kicker">${isAdmin?'administração global':'área privada do cliente'}</p><h1 data-title>Visão geral</h1><p data-subtitle>${escapeHtml(user.name||'Bem-vindo')}</p></div><div class="user-area"><span class="avatar">${escapeHtml((user.name||'N').slice(0,1).toUpperCase())}</span><span>${escapeHtml(user.email||'Administrador')}</span><button class="logout" id="logout">Sair</button></div></header><div id="sections"></div></main></div>`; buildSections(isAdmin); document.getElementById('logout').onclick=async()=>{await fetch('/api/platform/auth/logout',{method:'POST'});loginView()}; document.querySelectorAll('[data-nav]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-nav]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');activateSection(btn.dataset.nav)})); const tenantForm=document.getElementById('tenant-form'); if(tenantForm) tenantForm.addEventListener('submit',createTenant); const contactForm=document.getElementById('contact-form'); if(contactForm) contactForm.addEventListener('submit',createContact); const campaignForm=document.getElementById('campaign-form'); if(campaignForm) campaignForm.addEventListener('submit',createCampaign); const assistantForm=document.getElementById('assistant-form'); if(assistantForm) assistantForm.addEventListener('submit',saveAssistant); const paymentForm=document.getElementById('payment-form'); if(paymentForm) paymentForm.addEventListener('submit',submitPayment); const qrForm=document.getElementById('qr-form'); if(qrForm) qrForm.addEventListener('submit',requestQr); activateSection('overview'); }
    async function createTenant(e){ e.preventDefault(); const form=e.currentTarget; const msg=document.getElementById('tenant-message'); const button=form.querySelector('button'); button.disabled=true; msg.textContent='A criar conta…'; const payload={name:form.name.value,email:form.email.value,password:form.password.value}; try{const data=await api('/api/platform/admin/tenants',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); msg.textContent=`Cliente criado: ${data.tenant.name}`; form.reset(); loadTenants();}catch(error){msg.textContent=error.message}finally{button.disabled=false} }
    async function loadTenants(){ const target=document.getElementById('tenant-list'); if(!target)return; try{const data=await api('/api/platform/admin/tenants'); target.innerHTML=data.tenants.length?data.tenants.map(t=>`<div class="list-row"><span><strong>${escapeHtml(t.name)}</strong><small style="display:block;color:var(--muted)">${escapeHtml(t.plan||'demonstracao')}</small></span><span class="status">${escapeHtml(t.status||'active')}</span></div>`).join(''):'<p> Ainda não existem clientes.</p>';}catch(error){target.innerHTML=`<p>${escapeHtml(error.message)}</p>`} }
    async function createContact(e){e.preventDefault();const form=e.currentTarget,msg=document.getElementById('contact-message'),button=form.querySelector('button');button.disabled=true;msg.textContent='A guardar…';try{const file=form.file.files[0];if(file){const body=new FormData();body.append('file',file);const data=await api('/api/platform/client/contacts/import',{method:'POST',body});msg.textContent=`Importados: ${data.imported}; ignorados: ${data.skipped}.`;}else{await api('/api/platform/client/contacts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:form.name.value,phone:form.phone.value,opt_in:form.opt_in.checked})});msg.textContent='Contacto guardado.';}form.reset();loadContacts();}catch(error){msg.textContent=error.message}finally{button.disabled=false}}
    async function loadContacts(){const target=document.getElementById('contact-list');if(!target)return;try{const data=await api('/api/platform/client/contacts');target.innerHTML=data.contacts.length?data.contacts.map(c=>`<div class="list-row"><span>${escapeHtml(c.name)}<small style="display:block;color:var(--muted)">${escapeHtml(c.phone)}</small></span><span class="status">${c.opt_in?'opt-in':'bloqueado'}</span></div>`).join(''):'<p>Ainda não existem contactos.</p>'}catch(error){target.innerHTML=`<p>${escapeHtml(error.message)}</p>`}}
    async function createCampaign(e){e.preventDefault();const form=e.currentTarget,msg=document.getElementById('campaign-message'),button=form.querySelector('button');button.disabled=true;msg.textContent='A preparar a fila…';try{const data=await api('/api/platform/client/campaigns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:form.name.value,message:form.message.value})});msg.textContent=`Campanha criada com ${data.campaign.total} destinatários.`;form.reset();loadCampaigns();}catch(error){msg.textContent=error.message}finally{button.disabled=false}}
    async function loadCampaigns(){const target=document.getElementById('campaign-list');if(!target)return;try{const data=await api('/api/platform/client/campaigns');target.innerHTML=data.campaigns.length?data.campaigns.map(c=>`<div class="list-row"><span><strong>${escapeHtml(c.name)}</strong><small style="display:block;color:var(--muted)">${c.sent||0}/${c.total||0} enviados</small></span><span class="status">${escapeHtml(c.status||'queued')}</span></div>`).join(''):'<p>Ainda não existem campanhas.</p>'}catch(error){target.innerHTML=`<p>${escapeHtml(error.message)}</p>`}}
    function choosePlan(planId){const target=document.getElementById('selected-plan');if(target){target.value=planId;document.getElementById('payment-message').textContent=`Plano ${planId} selecionado. Faz a transferência e envia o comprovativo abaixo.`;document.getElementById('payment-message').scrollIntoView({behavior:'smooth',block:'center'})}}
    async function loadPlans(){const target=document.getElementById('plans-list');if(!target)return;try{const data=await api('/api/platform/client/plans');target.innerHTML=data.plans.map(p=>`<article class="card plan-card ${p.id==='premium'?'featured':''}"><p class="kicker">${p.id==='premium'?'mais completo':'plano mensal'}</p><h2>${escapeHtml(p.name)}</h2><div class="plan-price">${p.price_mt} MT</div><p>Validade de ${p.validity_days} dias${p.conversation_limit?` · ${p.conversation_limit} conversas`: ' · conversas ilimitadas'}</p><ul>${p.benefits.map(b=>`<li>${escapeHtml(b)}</li>`).join('')}</ul><button class="secondary" type="button" onclick="choosePlan('${p.id}')">Escolher ${escapeHtml(p.name)}</button></article>`).join('');document.getElementById('mpesa-number').textContent=data.mpesa_number;document.getElementById('mpesa-name').textContent=data.mpesa_name;document.getElementById('trial-days').textContent=data.trial_days;}catch(error){target.innerHTML=`<p>${escapeHtml(error.message)}</p>`}}
    async function submitPayment(e){e.preventDefault();const form=e.currentTarget,msg=document.getElementById('payment-message'),button=form.querySelector('button');button.disabled=true;msg.textContent='A validar o comprovativo…';try{const data=await api('/api/platform/client/payments/mpesa/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message_text:form.proof.value,client_phone:form.phone.value,selected_plan:form.selected_plan.value})});msg.textContent=data.response||'Comprovativo recebido. Aguarda a confirmação AutoPay.';form.reset();}catch(error){msg.textContent=error.message}finally{button.disabled=false}}
    async function requestQr(e){e.preventDefault();const form=e.currentTarget,msg=document.getElementById('qr-message'),button=form.querySelector('button');button.disabled=true;msg.textContent='A preparar a ligação Evolution…';try{const data=await api('/api/platform/client/evolution/qr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:form.phone.value})});msg.textContent=data.state==='open'?'WhatsApp já está ligado.':'Escaneia o QR Code agora no WhatsApp.';document.getElementById('qr-image').innerHTML=data.qrcode?`<img src="${data.qrcode}" alt="QR Code Evolution" style="max-width:280px;border-radius:12px;background:#fff;padding:10px">`:'';}catch(error){msg.textContent=error.message}finally{button.disabled=false}}
    async function loadIntegrations(){const target=document.getElementById('integration-list');if(!target)return;try{const data=await api('/api/platform/admin/integrations');target.innerHTML=data.integrations.map(i=>`<div class="list-row"><span><strong>${escapeHtml(i.label)}</strong><small style="display:block;color:var(--muted)">${escapeHtml(i.kind)}</small></span><span class="status">${i.configured?'configurada':'por configurar'}</span></div>`).join('')}catch(error){target.innerHTML=`<p>${escapeHtml(error.message)}</p>`}}
    async function loadConversations(){const target=document.getElementById('conversation-list');if(!target)return;try{const data=await api('/api/platform/client/conversations');target.innerHTML=data.conversations.length?data.conversations.map(c=>`<div class="list-row"><span><strong>${escapeHtml(c.phone)}</strong><small style="display:block;color:var(--muted)">${escapeHtml(c.status_atendimento||'bot')}</small></span><span class="status">${escapeHtml(c.ultima_interacao?'ativa':'sem histórico')}</span></div>`).join(''):'<p>Ainda não existem conversas.</p>'}catch(error){target.innerHTML=`<p>${escapeHtml(error.message)}</p>`}}
    async function loadAssistant(){try{const data=await api('/api/platform/client/assistant');document.getElementById('assistant-rules').value=data.diretrizes_corporativas||'';document.getElementById('assistant-knowledge').value=data.base_conhecimento_documentos||'';document.getElementById('assistant-timeout').value=data.timeout_humano_minutos||15;}catch(error){const msg=document.getElementById('assistant-message');if(msg)msg.textContent=error.message}}
    async function loadAudit(){const target=document.getElementById('audit-list');const health=document.getElementById('health-list');try{const [audit,status]=await Promise.all([api('/api/platform/admin/audit'),api('/api/platform/admin/health')]);if(health)health.innerHTML=Object.entries(status.services).map(([key,value])=>`<div class="list-row"><span>${escapeHtml(key)}</span><span class="status">${escapeHtml(value)}</span></div>`).join('');if(target)target.innerHTML=audit.events.length?audit.events.slice(-20).reverse().map(e=>`<div class="list-row"><span>${escapeHtml(e.event)}<small style="display:block;color:var(--muted)">${escapeHtml(e.actor_role||'system')}</small></span><span>${escapeHtml(e.tenant_id||'platform')}</span></div>`).join(''):'<p>Ainda não existem eventos.</p>';}catch(error){if(target)target.innerHTML=`<p>${escapeHtml(error.message)}</p>`}}
    async function saveAssistant(e){e.preventDefault();const form=e.currentTarget,msg=document.getElementById('assistant-message'),button=form.querySelector('button');button.disabled=true;try{await api('/api/platform/client/assistant',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({diretrizes_corporativas:form.rules.value,base_conhecimento_documentos:form.knowledge.value,timeout_humano_minutos:form.timeout.value})});msg.textContent='Definições guardadas.';}catch(error){msg.textContent=error.message}finally{button.disabled=false}}

    function sectionShell(id, title, copy){ return `<section class="section" data-section="${id}"><div class="card"><p class="kicker">NEGOBOT-MOZ</p><h2 data-section-title>${title}</h2><p data-section-body>${copy}</p></div></section>`; }
    function buildSections(isAdmin){ const sections=document.getElementById('sections'); sections.innerHTML=`<section class="section active" data-section="overview"><div class="grid" id="metrics"></div><div class="content-grid"><div class="card"><p class="kicker">próximo passo</p><h2>Uma operação inteira num só lugar.</h2><p>O painel está preparado para crescer com os módulos do NEGOBOT: clientes, integrações, contactos, campanhas, conversas e inteligência artificial.</p><div class="chips">${(isAdmin?['Clientes','Planos','Evolution API','Campanhas','Auditoria','Pagamentos']:['Contactos','Segmentos','Campanhas','Disparos','Conversas','Assistente IA']).map(x=>`<span class="chip">${x}</span>`).join('')}</div></div><div class="card"><p class="kicker">estado</p><h2>Serviços</h2><div class="list"><div class="list-row">Evolution API <span class="status">Ligada</span></div><div class="list-row">Motor IA <span class="status">Disponível</span></div><div class="list-row">Base de dados <span class="status">Online</span></div></div></div></div></section>${isAdmin?`<section class="section" data-section="tenants"><div class="content-grid"><div class="card"><p class="kicker">novo cliente</p><h2>Criar conta empresarial</h2><p>O cliente recebe uma área isolada e não verá configurações de outros tenants.</p><form id="tenant-form"><div class="field"><label>Nome da empresa</label><input name="name" required minlength="2" placeholder="Empresa do cliente"></div><div class="field"><label>Email de acesso</label><input name="email" type="email" required placeholder="cliente@empresa.co.mz"></div><div class="field"><label>Palavra-passe inicial</label><input name="password" type="password" required minlength="8" placeholder="Mínimo de 8 caracteres"></div><button class="secondary">Criar cliente</button><p class="notice" id="tenant-message"></p></form></div><div class="card"><p class="kicker">contas registadas</p><h2>Clientes e planos</h2><div class="list" id="tenant-list"><p>A carregar clientes…</p></div></div></div></section>`:`<section class="section" data-section="contacts"><div class="content-grid"><div class="card"><p class="kicker">novo contacto</p><h2>Adicionar contacto</h2><p>Guarda apenas contactos do teu tenant e controla o consentimento de comunicação.</p><form id="contact-form"><div class="field"><label>Nome</label><input name="name" required placeholder="Nome do contacto"></div><div class="field"><label>WhatsApp</label><input name="phone" placeholder="25884…"></div><div class="field"><label>Ou importar uma lista CSV/XLSX</label><input name="file" type="file" accept=".csv,.xlsx" style="padding:10px;border:1px solid var(--line);border-radius:9px;color:var(--muted);background:rgba(0,0,0,.16)"></div><label style="display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px"><input name="opt_in" type="checkbox" checked> Aceita receber mensagens</label><button class="secondary" style="margin-top:18px">Guardar contacto</button><p class="notice" id="contact-message"></p></form></div><div class="card"><p class="kicker">base de contactos</p><h2>Contactos do tenant</h2><div class="list" id="contact-list"><p>A carregar contactos…</p></div></div></div></section>`} ${isAdmin?`<section class="section" data-section="integrations"><div class="content-grid"><div class="card"><p class="kicker">infraestrutura</p><h2>Integrações globais</h2><p>Os segredos permanecem no servidor. Aqui editas apenas o nome e as notas que aparecem no painel.</p><div class="list" id="integration-list"><p>A carregar integrações…</p></div></div><div class="card"><p class="kicker">segurança</p><h2>Configuração protegida</h2><p>Evolution API, Groq, Firebase, Redis e n8n são geridos como ligações do administrador. Os clientes nunca recebem estas chaves.</p></div></div></section>`:`<section class="section" data-section="campaigns"><div class="content-grid"><div class="card"><p class="kicker">nova campanha</p><h2>Disparo protegido</h2><p>A fila usa os contactos com opt-in, variação spintax e intervalos controlados.</p><form id="campaign-form"><div class="field"><label>Nome da campanha</label><input name="name" required placeholder="Campanha de lançamento"></div><div class="field"><label>Mensagem</label><textarea name="message" required rows="6" style="width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;color:var(--text);background:rgba(0,0,0,.16)" placeholder="Olá {amigo|cliente}, temos uma novidade…"></textarea></div><button class="secondary">Colocar na fila</button><p class="notice" id="campaign-message"></p></form></div><div class="card"><p class="kicker">execuções</p><h2>Campanhas do tenant</h2><div class="list" id="campaign-list"><p>A carregar campanhas…</p></div></div></div></section>`} ${!isAdmin?`<section class="section" data-section="plans"><div class="card"><p class="kicker">planos e benefícios</p><h2>Escolhe o plano para o teu negócio</h2><p>Experimenta durante <strong id="trial-days">2</strong> dias sem compromisso. Depois da transferência manual, envia o comprovativo e o AutoPay confirma o ID antes de ativar o plano.</p><div class="plans-grid" id="plans-list"><p>A carregar planos…</p></div><div class="payment-box"><p class="kicker">pagamento manual M-Pesa</p><h2>Transfere para <span id="mpesa-number">855000929</span></h2><p>Nome: <strong id="mpesa-name">Abel Francisco</strong>. Depois cola abaixo o SMS completo ou o ID da transferência. O sistema compara o ID recebido com o registo AutoPay e só ativa quando houver correspondência.</p><form id="payment-form"><input type="hidden" id="selected-plan" name="selected_plan"><div class="field"><label>O teu número WhatsApp</label><input name="phone" placeholder="25884…" required></div><div class="field"><label>Comprovativo ou SMS M-Pesa</label><textarea name="proof" rows="5" required style="width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;color:var(--text);background:rgba(0,0,0,.16)" placeholder="Cola aqui o SMS completo ou o ID da transação"></textarea></div><button class="secondary">Enviar comprovativo para validação</button><p class="notice" id="payment-message"></p></form></div><div class="payment-box"><p class="kicker">ativar WhatsApp</p><h2>Depois da confirmação, liga o teu número</h2><p>O NEGOBOT prepara a instância na Evolution API e mostra o QR Code para digitalizares no WhatsApp. O número fica associado ao plano confirmado.</p><form id="qr-form"><div class="field"><label>Número que será automatizado</label><input name="phone" placeholder="25884…" required></div><button class="secondary">Gerar QR Code Evolution</button><p class="notice" id="qr-message"></p><div id="qr-image" style="margin-top:14px"></div></form></div><div class="actions" style="margin-top:18px"><a class="secondary" href="/falar-whatsapp">Falar com assistente no WhatsApp ↗</a><a class="secondary" href="/plataforma">Falar com assistente na plataforma ↗</a></div></div></section>`:''} ${isAdmin?`<section class="section" data-section="audit"><div class="content-grid"><div class="card"><p class="kicker">monitorização</p><h2>Saúde dos serviços</h2><div class="list" id="health-list"><p>A carregar estado…</p></div></div><div class="card"><p class="kicker">eventos</p><h2>Auditoria recente</h2><div class="list" id="audit-list"><p>A carregar eventos…</p></div></div></div></section>`:`<section class="section" data-section="inbox"><div class="card"><p class="kicker">caixa de entrada</p><h2>Conversas e atendimento humano</h2><p>Consulta o estado das conversas do teu tenant; a transição humano/bot continua sincronizada com o motor existente.</p><div class="list" id="conversation-list"><p>A carregar conversas…</p></div></div></section>`} ${!isAdmin?`<section class="section" data-section="assistant"><div class="card"><p class="kicker">inteligência artificial</p><h2>Configurar assistente</h2><p>Estas definições alimentam o fluxo do cliente sem expor as chaves Groq ou Firebase.</p><form id="assistant-form"><div class="field"><label>Diretrizes do negócio</label><textarea name="rules" id="assistant-rules" rows="6" style="width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;color:var(--text);background:rgba(0,0,0,.16)"></textarea></div><div class="field"><label>Base de conhecimento</label><textarea name="knowledge" id="assistant-knowledge" rows="6" style="width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;color:var(--text);background:rgba(0,0,0,.16)"></textarea></div><div class="field"><label>Timeout de atendimento humano (minutos)</label><input name="timeout" id="assistant-timeout" type="number" min="1" max="240" value="15"></div><button class="secondary">Guardar definições</button><p class="notice" id="assistant-message"></p></form></div></section>`:''}`; }
    async function activateSection(name){ const target=document.querySelector(`[data-nav="${name}"]`); document.querySelectorAll('.section').forEach(x=>x.classList.remove('active')); const sec=document.querySelector(`[data-section="${name}"]`); if(sec)sec.classList.add('active'); if(name==='tenants'){loadTenants();} if(name==='integrations'){loadIntegrations();} if(name==='audit'){loadAudit();} if(name==='contacts'){loadContacts();} if(name==='campaigns'){loadCampaigns();} if(name==='plans'){loadPlans();} if(name==='inbox'){loadConversations();} if(name==='assistant'){loadAssistant();} if(name==='overview'){try{const data=await api(window.platformIsAdmin?'/api/platform/admin/overview':'/api/platform/client/overview'); const metrics=document.getElementById('metrics'); if(metrics){const values=data.tenants!==undefined?[['Clientes',data.tenants],['Utilizadores',data.users],['Ativos',data.active_tenants],['Auditoria','Ativa']]:[['Contactos',data.contacts],['Campanhas',data.campaigns],['Conversas',data.conversations],['Plano',data.tenant.plan]];metrics.innerHTML=values.map(v=>`<div class="metric"><div class="metric-label">${v[0]}</div><div class="metric-value metric-accent">${v[1]}</div></div>`).join('')}}catch(e){if(e.message!=='auth')console.error(e)}} }
    fetch('/api/platform/auth/me').then(r=>r.json()).then(data=>data.authenticated?renderShell(data.user):loginView()).catch(()=>loginView('A plataforma está temporariamente indisponível.'));
  </script>
